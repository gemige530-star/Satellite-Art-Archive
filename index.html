<script>


/* Language Switch */


function changeLanguage(lang){


const elements=document.querySelectorAll("[data-en]");


elements.forEach(function(el){


if(lang==="zh"){

el.textContent=el.dataset.zh;

}

else{

el.textContent=el.dataset.en;

}


});


}





/* DeepSeek Chat */


async function sendMessage(){


const input=document.getElementById("userInput");

const history=document.getElementById("chat-history");


const userMsg=input.value.trim();


if(!userMsg)return;



history.innerHTML +=

`

<div style="text-align:right">

<div style="display:inline-block;background:#0af;padding:8px;border-radius:10px">

${userMsg}

</div>

</div>

`;


input.value="";



try{


const res=await fetch(

"https://api.deepseek.com/v1/chat/completions",

{

method:"POST",

headers:{


"Content-Type":"application/json",

"Authorization":"Bearer YOUR_DEEPSEEK_API_KEY"


},


body:JSON.stringify({

model:"deepseek-chat",

messages:[

{

role:"user",

content:userMsg

}

]

})

}


);



const data=await res.json();


const reply=

data.choices?.[0]?.message?.content ||

"No response";



history.innerHTML +=

`

<div>

<div style="display:inline-block;background:#333;padding:8px;border-radius:10px">

${reply}

</div>

</div>

`;


}

catch(error){


history.innerHTML +=

"<p style='color:red'>Connection error.</p>";


}


}





document

.getElementById("sendBtn")

.addEventListener(

"click",

sendMessage

);



document

.getElementById("userInput")

.addEventListener(

"keypress",

function(e){

if(e.key==="Enter")

sendMessage();

}

);



</script>
